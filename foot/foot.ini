[main]
font=monospace:size=11
pad=8x8

[colors-dark]
# E-Ink Monochrome Color Scheme
background=000000
foreground=ffffff

# Normal/Dark colors (mapped to black/gray/white)
regular0=000000  # black
regular1=7f7f7f  # red/dark gray
regular2=7f7f7f  # green
regular3=7f7f7f  # yellow
regular4=7f7f7f  # blue
regular5=7f7f7f  # magenta
regular6=7f7f7f  # cyan
regular7=ffffff  # white

# Bright colors
bright0=7f7f7f   # bright black / gray
bright1=ffffff   # bright red
bright2=ffffff   # bright green
bright3=ffffff   # bright yellow
bright4=ffffff   # bright blue
bright5=ffffff   # bright magenta
bright6=ffffff   # bright cyan
bright7=ffffff   # bright white

[cursor]
style=block










