[main]
# Font
font=monospace:size=11
font-bold=monospace:size=11
font-italic=monospace:size=11
font-bold-italic=monospace:size=11

# Window
pad=8x8
resize-delay-ms=100

[colors-dark]
# Base
background=000000
foreground=e8e8e8

# Normal ANSI colors
regular0=202020
regular1=d98f98
regular2=9fbd86
regular3=d6bd72
regular4=8eafd3
regular5=b79bca
regular6=82bdbd
regular7=d9d9d9

# Bright ANSI colors
bright0=707070
bright1=eaa1a9
bright2=b0ce96
bright3=e5cc82
bright4=a5c3e5
bright5=c8addb
bright6=9ed4d4
bright7=f5f5f5

# Selection
selection-background=282828
selection-foreground=ffffff

# Cursor
cursor=000000 ffffff
